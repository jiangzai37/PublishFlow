name: PublishFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt ruff==0.17.6 pip-audit==2.10.1
      - run: python -m ruff check app tests
      - run: python -m ruff format --check app tests
      - run: python -m pytest -q
      - run: python -m pip_audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r backend/requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium
          npm --prefix frontend ci
      - name: Run desktop and mobile browser regression
        env:
          TMP: ${{ runner.temp }}/publishflow-playwright
          TEMP: ${{ runner.temp }}/publishflow-playwright
          DATA_DIR: ${{ runner.temp }}/publishflow-smoke-data
          UPLOAD_DIR: ${{ runner.temp }}/publishflow-smoke-uploads
          PUBLISHFLOW_SMOKE_DATA_DIR: ${{ runner.temp }}/publishflow-smoke-data
        run: |
          mkdir -p "$TMP" "$DATA_DIR" "$UPLOAD_DIR"
          .venv/bin/python scripts/serve.py > /tmp/publishflow-api.log 2>&1 &
          api_pid=$!
          npm --prefix frontend run dev -- --host 127.0.0.1 > /tmp/publishflow-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$api_pid" "$web_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8765/api/health > /dev/null && curl -fsS http://127.0.0.1:5173 > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            cat /tmp/publishflow-api.log /tmp/publishflow-web.log
            exit 1
          fi
          .venv/bin/python scripts/smoke_test.py
      - name: Upload browser regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-regression
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore

  container:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: publishflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify empty-volume container startup and disabled publishing
        run: |
          container_id=$(docker run -d -p 127.0.0.1:18765:8765 -v publishflow-ci-data:/data -v publishflow-ci-uploads:/uploads publishflow:ci)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true; docker volume rm publishflow-ci-data publishflow-ci-uploads >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18765/api/health > /tmp/publishflow-container-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            docker logs "$container_id"
            exit 1
          fi
          python - <<'PY'
          import json
          import urllib.error
          import urllib.request
          from pathlib import Path
          health = json.loads(Path('/tmp/publishflow-container-health.json').read_text())
          assert health['publishing_enabled'] is False
          payload = json.dumps({'title': 'container-smoke', 'body': 'isolated test'}).encode()
          request = urllib.request.Request('http://127.0.0.1:18765/api/drafts', data=payload, headers={'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=10) as response:
              assert response.status == 201
              draft_id = json.load(response)['id']
          payload = json.dumps({'draft_id': draft_id, 'account_id': 1}).encode()
          request = urllib.request.Request('http://127.0.0.1:18765/api/publish', data=payload, headers={'Content-Type': 'application/json'}, method='POST')
          try:
              urllib.request.urlopen(request, timeout=10)
          except urllib.error.HTTPError as error:
              assert error.code == 503
          else:
              raise AssertionError('container must reject real publishing')
          PY
