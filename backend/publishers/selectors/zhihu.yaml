editor_url: https://zhuanlan.zhihu.com/write
title_selectors:
  - 'input[placeholder*="标题"]'
  - '.WriteIndexTitleInput input'
  - 'textarea[placeholder*="标题"]'
body_selectors:
  - '.public-DraftEditor-content[contenteditable="true"]'
  - '.WriteIndex-content [contenteditable="true"]'
  - '[contenteditable="true"][data-placeholder*="正文"]'
  - '[contenteditable="true"]'
topic_selectors:
  - 'button:has-text("添加话题")'
  - 'button:has-text("话题")'
  - '[class*="topic"]:has-text("话题")'
cover_selectors:
  - 'input[type="file"][accept*="image"]'
publish_selectors:
  - 'button:has-text("发布")'
confirm_selectors:
  - 'button:has-text("确认发布")'
manual_markers:
  - '验证码'
  - '滑动验证'
  - '安全验证'
  - '请完成验证'
success_selectors:
  - ':has-text("发布成功")'
